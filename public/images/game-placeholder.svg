<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">Game artwork pending review</title>
  <desc id="desc">A geometric placeholder used before licensed game artwork is added.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#137c8b"/>
      <stop offset="1" stop-color="#172033"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="290" cy="210" r="72" fill="#ffd166"/>
  <circle cx="510" cy="210" r="72" fill="#ff6b4a"/>
  <path d="M355 210h90" stroke="#fffaf0" stroke-width="18" stroke-linecap="round"/>
  <text x="400" y="360" fill="#fffaf0" font-family="Arial, sans-serif" font-size="34" text-anchor="middle">ARTWORK PENDING REVIEW</text>
</svg>
